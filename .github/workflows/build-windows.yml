name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "banhelper/**"
      - "builtin_plugins/**"
      - "assets/**"
      - "release/banhelper-bridge-2.0.0.jar"
      - "packaging/banhelper.spec"
      - "requirements-build.txt"
      - "run.py"
      - "scripts/build_windows.ps1"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "banhelper/**"
      - "builtin_plugins/**"
      - "assets/**"
      - "release/banhelper-bridge-2.0.0.jar"
      - "packaging/banhelper.spec"
      - "requirements-build.txt"
      - "run.py"
      - "scripts/build_windows.ps1"
      - ".github/workflows/build-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-build.txt
      - name: Build and smoke-test EXE
        shell: pwsh
        run: ./scripts/build_windows.ps1 -PythonCommand python
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: BanHelper-Windows-2.1.1
          path: |
            dist/windows/BanHelper.exe
            dist/windows/SHA256SUMS.txt
            release/banhelper-bridge-2.0.0.jar
          if-no-files-found: error
